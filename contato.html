<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Contato</title>
</head>
<body>

<h1>Formulário de Contato</h1>

<p>Preencha os dados abaixo:</p>

<form action="" method="post">

<label for="nome">Nome:</label><br>
<input type="text" id="nome" name="nome" required placeholder="Digite seu nome"><br><br>

<label for="email">Email:</label><br>
<input type="email" id="email" name="email" required placeholder="Digite seu email"><br><br>

<label for="assunto">Assunto:</label><br>
<input type="text" id="assunto" name="assunto"><br><br>

<label for="estado">Estado:</label><br>
<select id="estado" name="estado">
    <option>SC</option>
    <option>PR</option>
</select><br><br>

<label for="mensagem">Mensagem:</label><br>
<input type="text" id="mensagem" name="mensagem"><br><br>

<button type="submit">Enviar</button>

</form>

<br>
<a href="4_curriculo.html">Voltar</a>

</body>
</html>
