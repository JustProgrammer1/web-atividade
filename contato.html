<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Formulário de Contato</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }
        .container {
            width: 50%;
            margin: 30px auto;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }
        input, select, textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
        }
        button {
            margin-top: 15px;
            padding: 10px;
            width: 100%;
            background-color: #333;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #555;
        }
        .topo {
            margin-bottom: 15px;
            padding: 10px;
            background-color: #eaeaea;
            border-left: 5px solid #333;
        }
        .voltar {
            display: block;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- Link de navegação -->
    <a class="voltar" href="./curriculo.html">← Voltar para Currículo</a>

    <!-- Mensagem no topo -->
    <div class="topo">
        <p>Preencha o formulário abaixo para entrar em contato. Os campos obrigatórios devem ser preenchidos corretamente antes do envio.</p>
    </div>

    <!-- Formulário -->
    <form>

        <!-- Nome -->
        <label for="nome">Nome *</label>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>

        <!-- E-mail -->
        <label for="email">E-mail *</label>
        <input type="email" id="email" name="email" placeholder="exemplo@email.com" required>

        <!-- Assunto -->
        <label for="assunto">Assunto</label>
        <input type="text" id="assunto" name="assunto" placeholder="Digite o assunto">

        <!-- Estado -->
        <label for="estado">Estado</label>
        <select id="estado" name="estado">
            <option value="">Selecione seu estado</option>
            <option value="SC">Santa Catarina</option>
            <option value="PR">Paraná</option>
            <option value="RS">Rio Grande do Sul</option>
            <option value="SP">São Paulo</option>
            <option value="RJ">Rio de Janeiro</option>
            <option value="MG">Minas Gerais</option>
        </select>

        <!-- Mensagem -->
        <label for="mensagem">Mensagem</label>
        <textarea id="mensagem" name="mensagem" rows="5" placeholder="Digite sua mensagem"></textarea>

        <!-- Botão -->
        <button type="submit">Enviar</button>

    </form>

</div>

</body>
</html>
